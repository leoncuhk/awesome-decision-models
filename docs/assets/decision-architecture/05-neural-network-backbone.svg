<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1320" viewBox="0 0 1640 1320" role="img" aria-labelledby="title"><title id="title">Qwen3.5-4B neural network structure and parameter locations</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20334a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, PingFang SC, sans-serif" fill="#20334a"><rect x="55" y="420" width="330" height="455" rx="3" fill="#f9fbfd" stroke="#20334a" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="460" y="200" width="460" height="820" rx="3" fill="#fbfcfe" stroke="#20334a" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M220 1110 L220 1069" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M220 1005 L220 967" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M220 875 L220 845" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M220 785 L220 755" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M220 695 L220 665" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M220 605 L220 575" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M220 925 L220 875" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M220 420 L220 382" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M220 320 L220 284" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M220 242 L220 210" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M690 945 L690 898" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M690 850 L690 797" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M690 725 L690 682" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M580 965 L580 965 L495 965 L495 665" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M495 665 L673 665" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M690 648 L690 618" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M690 570 L690 522" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M690 440 L690 382" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M707 665 L707 665 L885 665 L885 365" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M885 365 L707 365" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><path d="M690 348 L690 308" fill="none" stroke="#20334a" stroke-width="1.6" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="50" y="48" text-anchor="start" font-size="32" font-weight="bold" fill="#20334a">Qwen3.5-4B｜神经网络结构图</text><text x="50" y="84" text-anchor="start" font-size="20" font-weight="normal" fill="#20334a">自下向上读；左：网络堆叠　中：单层及残差　右：内部算子与LoRA位置</text><text x="220" y="140" text-anchor="middle" font-size="24" font-weight="bold" fill="#20334a">语言主干结构</text><rect x="105" y="1110" width="230" height="52" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><path d="M128.0 1110v52" stroke="#9aafc4" stroke-width=".6"/><path d="M151.0 1110v52" stroke="#9aafc4" stroke-width=".6"/><path d="M174.0 1110v52" stroke="#9aafc4" stroke-width=".6"/><path d="M197.0 1110v52" stroke="#9aafc4" stroke-width=".6"/><path d="M220.0 1110v52" stroke="#9aafc4" stroke-width=".6"/><path d="M243.0 1110v52" stroke="#9aafc4" stroke-width=".6"/><path d="M266.0 1110v52" stroke="#9aafc4" stroke-width=".6"/><path d="M289.0 1110v52" stroke="#9aafc4" stroke-width=".6"/><path d="M312.0 1110v52" stroke="#9aafc4" stroke-width=".6"/><rect x="105" y="1079" width="230" height="26" fill="white"/><text x="220.0" y="1100" text-anchor="middle" font-size="18" font-weight="normal" fill="#20334a">输入 token IDs</text><rect x="80" y="1005" width="280" height="64" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="220.0" y="1043.65" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">Embedding  E ∈ R^(V×d)</text><rect x="100" y="925" width="240" height="42" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><path d="M130.0 925v42" stroke="#9aafc4" stroke-width=".6"/><path d="M160.0 925v42" stroke="#9aafc4" stroke-width=".6"/><path d="M190.0 925v42" stroke="#9aafc4" stroke-width=".6"/><path d="M220.0 925v42" stroke="#9aafc4" stroke-width=".6"/><path d="M250.0 925v42" stroke="#9aafc4" stroke-width=".6"/><path d="M280.0 925v42" stroke="#9aafc4" stroke-width=".6"/><path d="M310.0 925v42" stroke="#9aafc4" stroke-width=".6"/><path d="M100 939.0h240" stroke="#9aafc4" stroke-width=".6"/><path d="M100 953.0h240" stroke="#9aafc4" stroke-width=".6"/><rect x="100" y="894" width="240" height="26" fill="white"/><text x="220.0" y="915" text-anchor="middle" font-size="18" font-weight="normal" fill="#20334a">输入表示 X ∈ R^(L×d)</text><text x="220" y="454" text-anchor="middle" font-size="21" font-weight="bold" fill="#20334a">32个语言层 = 8组 × 4层</text><rect x="75" y="785" width="290" height="60" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="220.0" y="820.95" text-anchor="middle" font-size="17" font-weight="normal" fill="#20334a">Layer 1：DeltaNet + FFN</text><rect x="75" y="695" width="290" height="60" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="220.0" y="730.95" text-anchor="middle" font-size="17" font-weight="normal" fill="#20334a">Layer 2：DeltaNet + FFN</text><rect x="75" y="605" width="290" height="60" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="220.0" y="640.95" text-anchor="middle" font-size="17" font-weight="normal" fill="#20334a">Layer 3：DeltaNet + FFN</text><rect x="75" y="515" width="290" height="60" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="220.0" y="550.95" text-anchor="middle" font-size="17" font-weight="normal" fill="#20334a">Layer 4：Full Attention + FFN</text><text x="220" y="491" text-anchor="middle" font-size="17" font-weight="normal" fill="#20334a">该4层组重复8次</text><rect x="80" y="320" width="280" height="62" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="220.0" y="357.65" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">Final RMSNorm</text><rect x="100" y="242" width="240" height="42" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><path d="M130.0 242v42" stroke="#9aafc4" stroke-width=".6"/><path d="M160.0 242v42" stroke="#9aafc4" stroke-width=".6"/><path d="M190.0 242v42" stroke="#9aafc4" stroke-width=".6"/><path d="M220.0 242v42" stroke="#9aafc4" stroke-width=".6"/><path d="M250.0 242v42" stroke="#9aafc4" stroke-width=".6"/><path d="M280.0 242v42" stroke="#9aafc4" stroke-width=".6"/><path d="M310.0 242v42" stroke="#9aafc4" stroke-width=".6"/><path d="M100 256.0h240" stroke="#9aafc4" stroke-width=".6"/><path d="M100 270.0h240" stroke="#9aafc4" stroke-width=".6"/><rect x="100" y="211" width="240" height="26" fill="white"/><text x="220.0" y="232" text-anchor="middle" font-size="18" font-weight="normal" fill="#20334a">H ∈ R^(L×2560)</text><rect x="80" y="165" width="280" height="45" rx="3" fill="#fff0d5" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="220.0" y="193.8" text-anchor="middle" font-size="18" font-weight="normal" fill="#20334a">LM head：Linear(d → V)</text><text x="220" y="1190" text-anchor="middle" font-size="18" font-weight="normal" fill="#20334a">d = 2560；V = 词表大小</text><text x="220" y="1215" text-anchor="middle" font-size="18" font-weight="normal" fill="#20334a">L = 序列长度；FFN宽度 = 9216</text><text x="220" y="1240" text-anchor="middle" font-size="18" font-weight="normal" fill="#20334a">这里是稠密FFN，不是MoE</text><text x="690" y="140" text-anchor="middle" font-size="24" font-weight="bold" fill="#20334a">展开：一个 Decoder Layer</text><text x="690" y="246" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">同一残差结构适用于两种序列算子</text><rect x="580" y="945" width="220" height="40" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><path d="M607.5 945v40" stroke="#9aafc4" stroke-width=".6"/><path d="M635.0 945v40" stroke="#9aafc4" stroke-width=".6"/><path d="M662.5 945v40" stroke="#9aafc4" stroke-width=".6"/><path d="M690.0 945v40" stroke="#9aafc4" stroke-width=".6"/><path d="M717.5 945v40" stroke="#9aafc4" stroke-width=".6"/><path d="M745.0 945v40" stroke="#9aafc4" stroke-width=".6"/><path d="M772.5 945v40" stroke="#9aafc4" stroke-width=".6"/><path d="M580 958.3333333333334h220" stroke="#9aafc4" stroke-width=".6"/><path d="M580 971.6666666666666h220" stroke="#9aafc4" stroke-width=".6"/><rect x="580" y="914" width="220" height="26" fill="white"/><text x="690.0" y="935" text-anchor="middle" font-size="18" font-weight="normal" fill="#20334a">Xℓ：L × d</text><rect x="560" y="850" width="260" height="48" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="690.0" y="880.65" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">RMSNorm</text><rect x="530" y="725" width="320" height="72" rx="3" fill="#fff0d5" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="690.0" y="754.65" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">Gated DeltaNet</text><text x="690.0" y="780.65" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">或 Gated Full Attention</text><circle cx="690" cy="665" r="17" fill="white" stroke="#20334a" stroke-width="1.6"/><text x="690" y="672" text-anchor="middle" font-size="24" font-weight="normal" fill="#20334a">+</text><rect x="560" y="570" width="260" height="48" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="690.0" y="600.65" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">RMSNorm</text><rect x="530" y="440" width="320" height="82" rx="3" fill="#fff0d5" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="690.0" y="474.65" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">Dense SwiGLU FFN</text><text x="690.0" y="500.65" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">d → 9216 → d</text><circle cx="690" cy="365" r="17" fill="white" stroke="#20334a" stroke-width="1.6"/><text x="690" y="372" text-anchor="middle" font-size="24" font-weight="normal" fill="#20334a">+</text><text x="690" y="294" text-anchor="middle" font-size="21" font-weight="normal" fill="#20334a">Xℓ₊₁：L × d</text><text x="690" y="1070" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">残差相加；归一化不改变 L × d</text><text x="690" y="1096" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">LoRA加在选定Linear矩阵上</text><text x="690" y="1122" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">不是在32层之后追加一个“LoRA层”</text><text x="1280" y="140" text-anchor="middle" font-size="24" font-weight="bold" fill="#20334a">内部网络算子</text><rect x="990" y="185" width="590" height="235" rx="3" fill="#f4f6f8" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="1285" y="222" text-anchor="middle" font-size="22" font-weight="bold" fill="#20334a">Full Attention（8层）</text><rect x="1010" y="247" width="170" height="54" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="1095.0" y="279.95" text-anchor="middle" font-size="17" font-weight="normal" fill="#20334a">Wq / gate</text><rect x="1200" y="247" width="170" height="54" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="1285.0" y="279.95" text-anchor="middle" font-size="17" font-weight="normal" fill="#20334a">Wk</text><rect x="1390" y="247" width="170" height="54" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="1475.0" y="279.95" text-anchor="middle" font-size="17" font-weight="normal" fill="#20334a">Wv</text><text x="1285" y="337" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">Q/K归一化 + RoPE；GQA(Q,K,V)</text><text x="1285" y="377" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">注意力输出 ⊙ sigmoid(gate) → Wo</text><rect x="990" y="440" width="590" height="240" rx="3" fill="#f4f6f8" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="1285" y="479" text-anchor="middle" font-size="22" font-weight="bold" fill="#20334a">Gated DeltaNet（24层）</text><text x="1285" y="522" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">Q/K/V投影 → 因果卷积 + SiLU</text><text x="1285" y="548" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">Q/K归一化 → 门控delta状态更新</text><text x="1285" y="574" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">衰减／更新门控制递归状态 Sₜ</text><text x="1285" y="600" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">输出经门控归一化 → out_proj</text><rect x="990" y="700" width="590" height="220" rx="3" fill="#f4f6f8" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="1285" y="739" text-anchor="middle" font-size="22" font-weight="bold" fill="#20334a">SwiGLU FFN（每层）</text><rect x="1020" y="769" width="245" height="52" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="1142.5" y="800.95" text-anchor="middle" font-size="17" font-weight="normal" fill="#20334a">gate_proj：d → 9216</text><rect x="1290" y="769" width="260" height="52" rx="3" fill="#e9f1fa" stroke="#20334a" stroke-width="1.5" stroke-dasharray=""/><text x="1420.0" y="800.95" text-anchor="middle" font-size="17" font-weight="normal" fill="#20334a">up_proj：d → 9216</text><text x="1285" y="856" text-anchor="middle" font-size="20" font-weight="normal" fill="#20334a">SiLU(gate(x)) ⊙ up(x)</text><text x="1285" y="890" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">down_proj：9216 → d</text><rect x="990" y="950" width="590" height="225" rx="3" fill="#fff9ef" stroke="#9b691b" stroke-width="1.5" stroke-dasharray=""/><text x="1285" y="992" text-anchor="middle" font-size="22" font-weight="bold" fill="#20334a">LoRA：修改线性层的参数化</text><text x="1285" y="1035" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">W有效 = W原始 + (α/r) B A</text><text x="1285" y="1061" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">A：输入维 → r；B：r → 输出维</text><text x="1285" y="1087" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">冻结W原始，只更新A、B（及指定头）</text><text x="1285" y="1113" text-anchor="middle" font-size="19" font-weight="normal" fill="#20334a">全参模式则更新选定的原始矩阵</text><text x="50" y="1270" text-anchor="start" font-size="18" font-weight="normal" fill="#20334a">配置依据：Qwen3.5-4B @851bf6e8。Qwen3.8-27B为64层、d=5120、FFN=17408；不能混用尺寸。</text></g></svg>